plugins {
    id 'com.android.application'
    id("com.google.gms.google-services")
    id 'com.google.devtools.ksp'

}
import com.github.megatronking.stringfog.plugin.StringFogMode
import com.github.megatronking.stringfog.plugin.kg.RandomKeyGenerator

def enableAabResGuard = providers.gradleProperty("enableAabResGuard")
        .map { it.toBoolean() }
        .orElse(false)
        .get()

if (enableAabResGuard) {
    apply plugin: 'com.bytedance.android.aabResGuard'
}

apply plugin: 'stringfog'

def appVersionName = "1.1"

android {
    namespace 'com.zero.study'
    compileSdk rootProject.ext.compileSdk
    defaultConfig {
        applicationId APPLICATION_ID
        minSdk rootProject.ext.minSdk
        targetSdk rootProject.ext.targetSdk
        versionCode 1
        versionName appVersionName
        buildConfigField("String", "COUNTRY_API_URL", "\"https://ipinfo.io/json/\"")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        debug {
            storeFile file(STORE_PATH)
            storePassword STORE_PASSWORD
            keyAlias KEY_ALIAS
            keyPassword KEY_PASSWORD
            v2SigningEnabled true
        }

        release {
            storeFile file(STORE_PATH)
            storePassword STORE_PASSWORD
            keyAlias KEY_ALIAS
            keyPassword KEY_PASSWORD
            v2SigningEnabled true
        }
    }
    buildTypes {
        debug {
            // 设置调试时包名后添加debug以防止与正式版安装冲突
            // applicationIdSuffix '.debug'
            signingConfig signingConfigs.release
            debuggable true
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            signingConfig signingConfigs.release
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }


    buildFeatures {
        viewBinding = true
        buildConfig = true
        aidl = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

stringfog {
    implementation 'com.github.megatronking.stringfog.xor.StringFogImpl'
    packageName 'com.zero.study'
    enable true
    fogPackages = ["com.zero.study"]
    kg new RandomKeyGenerator()
    mode StringFogMode.bytes
}

androidComponents {
    onVariants(selector().withBuildType("release")) { variant ->
        variant.outputs.each { output ->
            def createTime = new Date().format("yyyyMMddHHmm", TimeZone.getTimeZone("GMT+08:00"))
            def fileName = "Study_${variant.buildType}_V${appVersionName}_${createTime}.apk"
            output.outputFileName.set(fileName)
        }
    }
}
if (enableAabResGuard) {
    aabResGuard {
        mappingFile = file("mapping.txt").toPath()
        whiteList = ["*.R.raw.*",
                     "*.R.drawable.icon",
                     "*.R.string.default_web_client_id",
                     "*.R.string.firebase_database_url",
                     "*.R.string.gcm_defaultSenderId",
                     "*.R.string.google_api_key",
                     "*.R.string.google_app_id",
                     "*.R.string.google_crash_reporting_api_key",
                     "*.R.string.google_storage_bucket",
                     "*.R.string.project_id",
                     "*.R.string.com.crashlytics.android.build_id"]
        obfuscatedBundleFileName = "app_build.aab"
        mergeDuplicatedRes = true
        enableFilterFiles = true
        filterList = ["BUNDLE-METADATA/*"]
        enableFilterStrings = false
        unusedStringPath = file("unused.txt").toPath()
        languageWhiteList = ["en", "ar", "de", "es", "fr", "hi", "in", "ja", "ko", "pt", "ru"]
    }
}
dependencies {
    //StringFog
    implementation libs.xor
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    implementation project(path: ':modules:admob')
    implementation project(path: ':modules:base')
    implementation project(path: ':modules:health')
    implementation project(path: ':modules:retention')
//    debugImplementation libs.leakcanary.android
    //OKHttp网络请求Android Studio插件
    implementation(libs.okhttp.profiler)
    ksp libs.androidx.room.compiler
    compileOnly libs.xposed
    implementation(libs.coil)
    implementation(libs.onesignal)
    implementation(libs.androidx.media3.exoplayer)
    implementation(libs.androidx.media3.ui)
    implementation(libs.androidx.media3.session)
}
