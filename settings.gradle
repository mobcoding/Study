pluginManagement {
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        gradlePluginPortal()
        maven { url 'https://jitpack.io' }
    }
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'stringfog') {
                useModule("com.github.mobcoding.StringFog:gradle-plugin:${requested.version}")
            }
            if (requested.id.id == 'com.bytedance.android.aabResGuard') {
                useModule('com.github.mobcoding.AabResGuard:aabresguard-plugin:v0.1.18')
            }
        }
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://api.xposed.info/' }
        maven { url 'https://jitpack.io' }
    }
}

rootProject.name = "Study"
include ':app'
include ':modules:admob'
include ':modules:base'
include ':modules:guide'
include ':modules:net'
include ':modules:health'
include ':modules:retention'
include ':modules:widget'
